# Construit le site Astro et le publie sur GitHub Pages à chaque push sur main.
# Aucune action manuelle : GitHub lance « npm run build » et met en ligne le dossier dist/.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de relancer le déploiement à la main depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Construire le site Astro
        uses: withastro/action@v3
        with:
          node-version: 22 # Astro exige Node >= 22 (le défaut de l'action est trop ancien)
        # Détecte le gestionnaire de paquets, lance « npm ci » puis « npm run build »
        # et prépare dist/ pour GitHub Pages.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
